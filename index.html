<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دعوة فرح مريم و باسل</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6ee;--card:#fffdf8;--ink:#3b2a22;--muted:#8a7468;--gold:#b8893b;--line:#e8d9bd}
@media (prefers-color-scheme:dark){:root{--bg:#1c1613;--card:#262019;--ink:#f3e8d6;--muted:#b9a58f;--gold:#d9ac5b;--line:#4a3d2e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Amiri',Georgia,serif;font-size:19px;line-height:1.8;text-align:center}
.wrap{max-width:520px;margin:0 auto;padding:28px 20px 48px}
.frame{border:1px solid var(--gold);outline:1px solid var(--line);outline-offset:6px;background:var(--card);border-radius:18px;padding:36px 22px;margin-bottom:26px}
h2{font-family:'Reem Kufi',Tahoma,sans-serif;font-size:24px;color:var(--gold);margin:0 0 8px}
.small{color:var(--muted);font-size:17px}
.names{font-family:'Reem Kufi',Tahoma,sans-serif;font-size:46px;font-weight:700;color:var(--gold);line-height:1.3;margin:14px 0}
.names span{display:block;font-size:26px;color:var(--muted);font-family:'Amiri',serif}
.orn{color:var(--gold);letter-spacing:8px;margin:10px 0}
.date{font-size:26px;font-weight:700}
.cd{display:flex;gap:10px;justify-content:center;margin-top:18px}
.cd div{flex:1;max-width:84px;border:1px solid var(--line);border-radius:12px;padding:8px 2px}
.cd b{display:block;font-size:28px;color:var(--gold)}
.cd i{font-style:normal;font-size:14px;color:var(--muted)}
.btn{display:inline-block;margin-top:14px;padding:11px 26px;border-radius:999px;background:var(--gold);color:#fff;text-decoration:none;font-size:17px}
</style>
</head>
<body>
<div class="wrap">
<section class="frame">
<div class="small" style="color:var(--gold);font-size:22px">بسم الله الرحمن الرحيم</div>
<div class="small">نتشرف بدعوتكم لحضور حفل زفاف</div>
<div class="names">مريم<span>و</span>باسل</div>
<div class="orn">✦ ✦ ✦</div>
</section>
<section class="frame">
<h2>الموعد</h2>
<div class="date">الجمعة ١١ ديسمبر ٢٠٢٦</div>
<div class="cd">
<div><b id="d">0</b><i>يوم</i></div>
<div><b id="h">0</b><i>ساعة</i></div>
<div><b id="m">0</b><i>دقيقة</i></div>
<div><b id="s">0</b><i>ثانية</i></div>
</div>
</section>
<section class="frame">
<h2>المكان</h2>
<div class="small">اضغط على الزر لعرض موقع الفرح</div>
<a class="btn" href="https://maps.app.goo.gl/cTc8QM68ocZXhLsg7?g_st=ic" target="_blank" rel="noopener">افتح الموقع على الخريطة</a>
</section>
<section class="frame">
<h2>في انتظاركم</h2>
<div class="small">وجودكم يكمل فرحتنا</div>
<div class="orn">✦</div>
<div class="small">في انتظاركم بكل حب ❤</div>
</section>
</div>
<script>
var W=new Date('2026-12-11T00:00:00+02:00');
function tick(){
var t=Math.max(0,W-new Date()),n=Math.floor;
document.getElementById('d').textContent=n(t/864e5);
document.getElementById('h').textContent=n(t%864e5/36e5);
document.getElementById('m').textContent=n(t%36e5/6e4);
document.getElementById('s').textContent=n(t%6e4/1e3);
}
tick();setInterval(tick,1000);
</script>
</body>
</html>
